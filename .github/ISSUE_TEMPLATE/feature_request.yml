name: Feature request
description: Suggest an improvement for everyday dashboard control.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What household task is difficult today?
      description: Describe the situation and the card or device involved.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Explain how the improvement would help, including alternatives you tried.
    validations:
      required: true
