name: Publish Dev
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build.mjs'
      - 'hacs.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: navet-cards-dev
  cancel-in-progress: false
jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: tag
        run: node scripts/release.mjs dev
  publish:
    needs: tag
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.tag.outputs.tag }}
